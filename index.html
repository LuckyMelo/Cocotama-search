*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
  font-family: 'M PLUS Rounded 1c', sans-serif;
  background: var(--bg);
  background-image: radial-gradient(circle, #ffd6ea 1.5px, transparent 1.5px);
  background-size: 28px 28px;
  min-height: 100vh;
  padding-bottom: calc(60px + var(--safe-bottom));
  color: var(--text);
  -webkit-overflow-scrolling: touch;
}

/* ══════════════════════════════
   HEADER
══════════════════════════════ */
header {
  background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
  padding: calc(28px + var(--safe-top)) 20px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
header::before, header::after {
  content: '✦';
  position: absolute;
  font-size: 80px;
  opacity: .12;
  color: #fff;
  pointer-events: none;
}
header::before { top: -20px; left: -10px; transform: rotate(-15deg); }
header::after  { bottom: -28px; right: -10px; transform: rotate(20deg); }
header h1 {
  font-family: 'Kaisei Decol', serif;
  font-size: clamp(1.7rem, 6vw, 2.8rem);
  color: #fff;
  letter-spacing: .08em;
  text-shadow: 0 2px 12px rgba(0,0,0,.2);
  position: relative;
  z-index: 1;
}
header p {
  color: rgba(255,255,255,.85);
  font-size: .83rem;
  margin-top: 5px;
  position: relative;
  z-index: 1;
}

/* ══════════════════════════════
   SEARCH WRAPPER
══════════════════════════════ */
.search-wrap {
  max-width: 560px;
  margin: 28px auto 0;
  padding: 0 16px;
  position: relative;
}

.search-box {
  display: flex;
  align-items: center;
  background: #fff;
  border: 2.5px solid var(--pink);
  border-radius: 999px;
  padding: 6px 14px 6px 20px;
  box-shadow: 0 4px 20px var(--shadow);
  transition: border-color .2s, box-shadow .2s;
}
.search-box:focus-within {
  border-color: var(--purple);
  box-shadow: 0 4px 28px rgba(192,132,252,.28);
}
.search-icon { font-size: 1.15rem; margin-right: 9px; flex-shrink: 0; }

/* font-size:16px → iOSで自動ズームしない */
#search {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 16px;
  background: transparent;
  color: var(--text);
}
#search::placeholder { color: #d0a0c0; }

.clear-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: none;
  background: var(--pink-lt);
  color: var(--pink-dk);
  font-size: .85rem;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s;
}
.clear-btn:hover { background: var(--pink); color: #fff; }
.clear-btn.visible { display: flex; }

/* ── match mode ── */
.match-toggle {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.match-toggle button {
  flex: 1;
  padding: 7px 8px;
  border-radius: 999px;
  border: 2px solid var(--border);
  background: #fff;
  color: var(--text-sub);
  font-family: inherit;
  font-size: .78rem;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all .15s;
  min-height: 36px;
}
.match-toggle button.active {
  background: var(--pink);
  border-color: var(--pink);
  color: #fff;
}

/* ── filter panel ── */
.filter-panel {
  margin-top: 12px;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 18px;
  padding: 12px 16px;
  box-shadow: 0 2px 12px var(--shadow);
}
.filter-toggle-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: none;
  border: none;
  font-family: inherit;
  font-size: .85rem;
  font-weight: 700;
  color: var(--pink-dk);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  padding: 2px 0;
  min-height: 36px;
}
.filter-toggle-btn .arrow {
  display: inline-block;
  transition: transform .22s;
  font-style: normal;
}
.filter-toggle-btn.open .arrow { transform: rotate(180deg); }

.filter-body {
  overflow: hidden;
  max-height: 0;
  transition: max-height .28s ease;
}
.filter-body.open { max-height: 400px; }

.filter-inner { padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }

.filter-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-label {
  font-size: .77rem;
  font-weight: 700;
  color: var(--text-sub);
  white-space: nowrap;
  min-width: 46px;
}
.filter-chips { display: flex; flex-wrap: wrap; gap: 5px; }

.chip {
  padding: 5px 13px;
  border-radius: 999px;
  border: 2px solid var(--border);
  background: #fff;
  color: var(--text-sub);
  font-family: inherit;
  font-size: .77rem;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all .14s;
  min-height: 34px;
}
.chip:hover  { border-color: var(--pink); color: var(--pink-dk); }
.chip.active         { background: var(--pink-lt);   border-color: var(--pink);   color: var(--pink-dk); }
.chip.active.purple  { background: var(--purple-lt); border-color: var(--purple); color: #7c3aed; }
.chip.active.mint    { background: var(--mint-lt);   border-color: var(--mint);   color: #065f46; }

.filter-reset-btn {
  align-self: flex-start;
  padding: 5px 14px;
  border-radius: 999px;
  border: 2px solid var(--border);
  background: #fff;
  color: var(--text-sub);
  font-family: inherit;
  font-size: .75rem;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all .14s;
  min-height: 32px;
}
.filter-reset-btn:hover { border-color: var(--pink); color: var(--pink-dk); }

/* ── active filter badges ── */
.active-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}
.af-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--pink-lt);
  color: var(--pink-dk);
  border-radius: 999px;
  font-size: .73rem;
  font-weight: 700;
  padding: 3px 8px 3px 10px;
}
.af-badge button {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--pink-dk);
  font-size: .9rem;
  line-height: 1;
  padding: 0 0 0 2px;
  -webkit-tap-highlight-color: transparent;
}

/* ══════════════════════════════
   SUGGEST DROPDOWN
══════════════════════════════ */
#suggest {
  list-style: none;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 16px;
  margin-top: 8px;
  max-height: 50vh;
  overflow-y: auto;
  position: absolute;
  left: 16px; right: 16px;
  z-index: 200;
  box-shadow: 0 8px 32px var(--shadow);
  display: none;
  scrollbar-width: thin;
  scrollbar-color: var(--pink-lt) transparent;
  -webkit-overflow-scrolling: touch;
}
#suggest.open { display: block; }
#suggest::-webkit-scrollbar { width: 5px; }
#suggest::-webkit-scrollbar-thumb { background: var(--pink-lt); border-radius: 999px; }

.suggest-count {
  font-size: .75rem;
  color: var(--text-sub);
  padding: 7px 18px 5px;
  border-bottom: 1px solid #fce8f3;
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 1;
}
#suggest li {
  padding: 11px 18px;
  cursor: pointer;
  font-size: .95rem;
  border-bottom: 1px solid #fce8f3;
  transition: background .1s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  -webkit-tap-highlight-color: transparent;
}
#suggest li:last-child { border-bottom: none; }
#suggest li::before { content: '🌟'; font-size: .8rem; flex-shrink: 0; }
#suggest li:hover,
#suggest li.active { background: var(--pink-lt); }

#suggest li mark {
  background: var(--yellow);
  border-radius: 3px;
  padding: 0 1px;
  font-style: normal;
  color: inherit;
}
#suggest .no-result {
  padding: 14px 18px;
  color: var(--text-sub);
  font-size: .88rem;
  text-align: center;
  cursor: default;
}
#suggest .no-result::before { content: none; }

/* ══════════════════════════════
   RESULT CARD
══════════════════════════════ */
#result {
  max-width: 560px;
  margin: 22px auto 0;

}
.card {
  background: var(--card-bg);

}

  align-items: flex-start;

.card-img-wrap {

  overflow: hidden;
}
.card-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
.no-img-placeholder { font-size: 2.8rem; }

.card-title-area { flex: 1; min-width: 0; }
.card-name {
  font-family: 'Kaisei Decol', serif;
  font-size: 1.55rem;

}
.card-en-name {
  font-size: .8rem;

  letter-spacing: .04em;
}
.badge-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--pink-lt);
  color: #9d4570;
  border-radius: 999px;

.detail-grid {

}

  background: var(--pink-lt);

}
.detail-grid .dd {

}

.hint {
  text-align: center;
  color: var(--text-sub);
  font-size: .9rem;
  padding: 40px 0;
}

/* ══════════════════════════════

══════════════════════════════ */
@media (max-width: 420px) {

}
@media (pointer: coarse) {

  .match-toggle button { min-height: 40px; }
}

<header>

<div class="search-wrap">

  <!-- 検索ボックス -->

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input id="search"
           placeholder="名前を入力（ひらがな・ローマ字OK）"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false"
           inputmode="search" />
    <button class="clear-btn" id="clearBtn" aria-label="クリア">✕</button>
  </div>

  <!-- 検索モード切替 -->

  <div class="match-toggle" role="group" aria-label="検索モード">
    <button class="active" data-mode="prefix"  aria-pressed="true" title="入力した文字から始まる名前を検索">前方一致</button>
    <button               data-mode="partial" aria-pressed="false" title="名前のどこかに含まれていれば検索">部分一致</button>
    <button               data-mode="fuzzy"   aria-pressed="false" title="文字の順序が合っていれば検索（あいまい）">あいまい</button>
  </div>

  <!-- フィルターパネル -->

  <div class="filter-panel">
    <button class="filter-toggle-btn" id="filterToggleBtn" aria-expanded="false">
      <span>🔧 絞り込みフィルター</span>
      <i class="arrow">▼</i>
    </button>
    <div class="filter-body" id="filterBody">
      <div class="filter-inner" id="filterInner">
        <!-- JS で生成 -->
      </div>
    </div>
  </div>

  <!-- アクティブフィルターバッジ -->

  <div class="active-filters" id="activeFilters"></div>

  <!-- サジェストドロップダウン -->

  <div class="hint">
    <div class="icon">🌸</div>
    上の検索窓をタップしてここたまを探してね！

<script>
/* ══════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════ */
let data       = [];
let matchMode  = 'prefix';   // 'prefix' | 'partial' | 'fuzzy'
let filters    = {};         // { colKey: Set<rawValue> }
let currentIdx = -1;
let suggestOpen = false;

/* ══════════════════════════════════════════════════
   DOM
══════════════════════════════════════════════════ */
const searchEl        = document.getElementById('search');
const suggestEl       = document.getElementById('suggest');
const resultEl        = document.getElementById('result');
const clearBtn        = document.getElementById('clearBtn');
const filterToggleBtn = document.getElementById('filterToggleBtn');
const filterBody      = document.getElementById('filterBody');
const filterInner     = document.getElementById('filterInner');
const activeFiltersEl = document.getElementById('activeFilters');

/* ══════════════════════════════════════════════════
   FILTER DEFINITIONS
   ─ CSV の列名・値に合わせて編集してください ─
══════════════════════════════════════════════════ */
const FILTER_DEFS = [
  {
    key: '性別', label: '性別', type: 'single', chipClass: '',
    options: [
      { raw: '1', label: '♀ 女の子' },
      { raw: '0', label: '♂ 男の子' },
    ]
  },
  {
    key: '一人前', label: '一人前', type: 'single', chipClass: 'mint',
    options: [
      { raw: '1', label: '〇 一人前' },
      { raw: '0', label: '× まだ' },
    ]
  },
  {
    key: '公募', label: '公募', type: 'single', chipClass: 'purple',
    options: [
      { raw: '1', label: '〇 あり' },
      { raw: '0', label: '× なし' },
      { raw: '2', label: 'スタッフ' },
    ]
  },
];

/* ══════════════════════════════════════════════════
   CSV LOAD
══════════════════════════════════════════════════ */
fetch('cocotama.csv')
  .then(r => r.text())
  .then(text => {
    const lines   = text.trim().split('\n');
    const headers = lines[0].split(',');
    data = lines.slice(1).map(line => {
      const values = line.split(',');
      const obj    = {};
      headers.forEach((h, i) => obj[h] = (values[i] || '').trim());
      obj._hira = toHiragana(obj['名前'] || '');
      obj._roma = toRomaji(obj._hira);
      return obj;
    });
    data.sort((a, b) => a._hira.localeCompare(b._hira, 'ja'));
    buildFilterUI();
  })
  .catch(() => console.warn('cocotama.csv の読み込みに失敗しました'));

/* ══════════════════════════════════════════════════
   CONVERTERS
══════════════════════════════════════════════════ */
function toHiragana(str) {
  return str.replace(/[\u30A1-\u30F6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
}
function toRomaji(str) {
  const map = {
    あ:'a',い:'i',う:'u',え:'e',お:'o',
    か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',
    さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',
    た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',
    な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',
    は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',
    ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',
    や:'ya',ゆ:'yu',よ:'yo',
    ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',
    わ:'wa',ん:'n',
    が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',
    ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',
    だ:'da',ぢ:'di',づ:'du',で:'de',ど:'do',
    ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',
    ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po',
    っ:'tt', ー:'-',
  };
  return str.split('').map(c => map[c] || c).join('');
}
function convertValue(key, value) {
  if (key === '性別')   return value === '1' ? '♀' : value === '0' ? '♂' : '不明';
  if (key === '一人前') return value === '1' ? '〇' : value === '0' ? '×' : '不明';
  if (key === '公募')   return value === '1' ? '〇' : value === '0' ? '×' : value === '2' ? 'スタッフ' : '不明';
  if (key === '魔法の呪文')
    return value === '1' ? 'ここんぽいぽいここったま！' : value === '0' ? '不明' : (value || '不明');
  return value || '不明';
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ══════════════════════════════════════════════════
   SEARCH LOGIC
══════════════════════════════════════════════════ */

/**
 * あいまい検索: クエリの文字が順序通りに target に含まれるか判定し、
 * マッチ文字数 / target 長 でスコアリング
 */
function fuzzyScore(target, query) {
  let ti = 0, qi = 0, score = 0;
  while (ti < target.length && qi < query.length) {
    if (target[ti] === query[qi]) { score++; qi++; }
    ti++;
  }
  return qi === query.length ? score / target.length : -1;
}

function applyFilters(pool) {
  for (const [key, vals] of Object.entries(filters)) {
    if (!vals || vals.size === 0) continue;
    pool = pool.filter(d => vals.has(d[key]));
  }
  return pool;
}

function applySearch(q) {
  let pool = applyFilters(data);
  if (!q) return pool;

  const ql = q.toLowerCase();
  const qh = toHiragana(ql);
  const qr = toRomaji(qh);

  if (matchMode === 'prefix') {
    return pool.filter(d =>
      d['名前'].startsWith(q) ||
      d._hira.startsWith(qh) ||
      d._roma.startsWith(qr)
    );
  }
  if (matchMode === 'partial') {
    return pool.filter(d =>
      d['名前'].includes(q) ||
      d._hira.includes(qh) ||
      d._roma.includes(qr)
    );
  }
  // fuzzy
  const scored = pool.map(d => ({
    d,
    s: Math.max(
      fuzzyScore(d['名前'], q),
      fuzzyScore(d._hira,   qh),
      fuzzyScore(d._roma,   qr)
    )
  })).filter(x => x.s >= 0);
  scored.sort((a, b) => b.s - a.s);
  return scored.map(x => x.d);
}

/* ── マッチ箇所をハイライト ── */
function highlight(text, q) {
  if (!q || matchMode === 'fuzzy') return escHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return escHtml(text);
  return escHtml(text.slice(0, idx))
       + '<mark>' + escHtml(text.slice(idx, idx + q.length)) + '</mark>'
       + escHtml(text.slice(idx + q.length));
}

/* ══════════════════════════════════════════════════
   SUGGEST
══════════════════════════════════════════════════ */
function openSuggest(list) {
  suggestEl.innerHTML = '';
  currentIdx = -1;

  const countEl = document.createElement('div');
  countEl.className = 'suggest-count';

  if (!list.length) {
    countEl.textContent = '0件 — 条件に一致するここたまがいません';
    const noRow = document.createElement('li');
    noRow.className = 'no-result';
    noRow.textContent = '😢 見つからなかったよ…';
    suggestEl.append(countEl, noRow);
    suggestEl.classList.add('open');
    suggestOpen = true;
    return;
  }

  const shown = list.slice(0, 60);
  countEl.textContent = `${list.length} 件${list.length > 60 ? '（上位60件表示）' : ''}`;
  suggestEl.appendChild(countEl);

  const q = searchEl.value;
  shown.forEach(d => {
    const li = document.createElement('li');
    li.setAttribute('role', 'option');
    li.innerHTML = highlight(d['名前'], q);
    li.addEventListener('mousedown', e => { e.preventDefault(); show(d); });
    li.addEventListener('touchend',  e => { e.preventDefault(); show(d); });
    suggestEl.appendChild(li);
  });

  suggestEl.classList.add('open');
  suggestOpen = true;
}

function closeSuggest() {
  suggestEl.classList.remove('open');
  suggestOpen = false;
}

function update() {
  const q = searchEl.value;
  clearBtn.classList.toggle('visible', q.length > 0);
  const hasFilter = Object.values(filters).some(s => s && s.size > 0);
  if (!q && !hasFilter) { openSuggest(data); return; }
  openSuggest(applySearch(q));
}

/* ══════════════════════════════════════════════════
   EVENTS — search input
══════════════════════════════════════════════════ */
searchEl.addEventListener('focus', update);
searchEl.addEventListener('input', update);
searchEl.addEventListener('blur',  () => setTimeout(closeSuggest, 200));

clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  clearBtn.classList.remove('visible');
  resultEl.innerHTML = '<div class="hint"><div class="icon">🌸</div>上の検索窓をタップしてここたまを探してね！</div>';
  update();
  searchEl.focus();
});

searchEl.addEventListener('keydown', e => {
  if (!suggestOpen) return;
  const items = [...suggestEl.querySelectorAll('li:not(.no-result)')];
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    currentIdx = (currentIdx + 1) % items.length;
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    currentIdx = (currentIdx - 1 + items.length) % items.length;
  } else if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault();
    if (currentIdx >= 0) items[currentIdx]?.dispatchEvent(new Event('mousedown'));
    return;
  }
  items.forEach((li, i) => li.classList.toggle('active', i === currentIdx));
  items[currentIdx]?.scrollIntoView({ block: 'nearest' });
});

/* ══════════════════════════════════════════════════
   EVENTS — match mode
══════════════════════════════════════════════════ */
document.querySelectorAll('.match-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    matchMode = btn.dataset.mode;
    document.querySelectorAll('.match-toggle button').forEach(b => {
      b.classList.toggle('active', b === btn);
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    });
    if (suggestOpen || searchEl.value) update();
  });
});

/* ══════════════════════════════════════════════════
   EVENTS — filter panel open/close
══════════════════════════════════════════════════ */
filterToggleBtn.addEventListener('click', () => {
  const isOpen = filterBody.classList.contains('open');
  filterBody.classList.toggle('open', !isOpen);
  filterToggleBtn.classList.toggle('open', !isOpen);
  filterToggleBtn.setAttribute('aria-expanded', String(!isOpen));
});

/* ══════════════════════════════════════════════════
   FILTER UI
══════════════════════════════════════════════════ */
function buildFilterUI() {
  filterInner.innerHTML = '';

  FILTER_DEFS.forEach(def => {
    const row = document.createElement('div');
    row.className = 'filter-row';

    const label = document.createElement('span');
    label.className = 'filter-label';
    label.textContent = def.label;
    row.appendChild(label);

    const chips = document.createElement('div');
    chips.className = 'filter-chips';

    def.options.forEach(opt => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (def.chipClass ? ' ' + def.chipClass : '');
      chip.textContent = opt.label;
      chip.dataset.key = def.key;
      chip.dataset.val = opt.raw;
      chip.addEventListener('click', () => onChipClick(def, opt, chip));
      chips.appendChild(chip);
    });

    row.appendChild(chips);
    filterInner.appendChild(row);
  });

  // リセットボタン
  const resetBtn = document.createElement('button');
  resetBtn.className = 'filter-reset-btn';
  resetBtn.textContent = '🔄 フィルターをリセット';
  resetBtn.addEventListener('click', resetFilters);
  filterInner.appendChild(resetBtn);
}

function onChipClick(def, opt, chip) {
  if (!filters[def.key]) filters[def.key] = new Set();
  const s = filters[def.key];

  if (def.type === 'single') {
    if (s.has(opt.raw)) {
      s.delete(opt.raw);
      chip.classList.remove('active');
    } else {
      // 同グループを全解除してから選択
      document.querySelectorAll(`.chip[data-key="${def.key}"]`)
        .forEach(c => c.classList.remove('active'));
      s.clear();
      s.add(opt.raw);
      chip.classList.add('active');
    }
  } else {
    if (s.has(opt.raw)) { s.delete(opt.raw); chip.classList.remove('active'); }
    else                { s.add(opt.raw);    chip.classList.add('active'); }
  }

  renderActiveFilters();
  update();
}

function resetFilters() {
  filters = {};
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  renderActiveFilters();
  update();
}

function renderActiveFilters() {
  activeFiltersEl.innerHTML = '';
  FILTER_DEFS.forEach(def => {
    const s = filters[def.key];
    if (!s || s.size === 0) return;
    s.forEach(raw => {
      const opt = def.options.find(o => o.raw === raw);
      if (!opt) return;
      const badge = document.createElement('span');
      badge.className = 'af-badge';
      badge.innerHTML = `${escHtml(def.label)}：${escHtml(opt.label)}
        <button aria-label="フィルター解除" data-key="${escHtml(def.key)}" data-val="${escHtml(raw)}">✕</button>`;
      badge.querySelector('button').addEventListener('click', () => {
        filters[def.key]?.delete(raw);
        document.querySelectorAll(`.chip[data-key="${def.key}"][data-val="${raw}"]`)
          .forEach(c => c.classList.remove('active'));
        renderActiveFilters();
        update();
      });
      activeFiltersEl.appendChild(badge);
    });
  });
}

/* ══════════════════════════════════════════════════
   SHOW CHARACTER CARD
══════════════════════════════════════════════════ */
const HIDDEN_KEYS = new Set(['_hira','_roma','EN-Name']);
const BADGE_KEYS  = new Set(['性別','一人前','公募']);

function genderBadge(val) {
  const v = convertValue('性別', val);
  const cls   = v === '♀' ? '' : 'purple';
  const label = v === '♀' ? '♀ 女の子' : v === '♂' ? '♂ 男の子' : '性別不明';
  return `<span class="badge ${cls}">${label}</span>`;
}
function boolBadge(label, key, val, cls = 'mint') {
  const v = convertValue(key, val);
  return `<span class="badge ${v === '〇' ? cls : 'yellow'}">${label}：${v}</span>`;
}
function createImg(enName) {
  const exts = ['webp','png','jpg'];
  const img   = document.createElement('img');
  img.alt     = enName;
  let i = 0;
  function tryLoad() {
    if (i >= exts.length) { img.style.display = 'none'; return; }
    img.src = `images/${enName}.${exts[i++]}`;
  }
  img.onerror = tryLoad;
  tryLoad();
  return img;
}

function show(d) {
  closeSuggest();
  searchEl.value = d['名前'];
  clearBtn.classList.add('visible');

  const card = document.createElement('div');
  card.className = 'card';

  // ── top ──
  const top = document.createElement('div');
  top.className = 'card-top';

  const imgWrap = document.createElement('div');
  imgWrap.className = 'card-img-wrap';
  imgWrap.appendChild(d['EN-Name']
    ? createImg(d['EN-Name'])
    : Object.assign(document.createElement('span'), { className: 'no-img-placeholder', textContent: '🌟' })
  );

  const titleArea = document.createElement('div');
  titleArea.className = 'card-title-area';
  titleArea.innerHTML = `
    <div class="card-name">${escHtml(d['名前'] || '？')}</div>
    ${d['EN-Name'] ? `<div class="card-en-name">${escHtml(d['EN-Name'])}</div>` : ''}
    <div class="badge-row">
      ${genderBadge(d['性別'])}
      ${d['一人前'] !== undefined ? boolBadge('一人前','一人前', d['一人前']) : ''}
      ${d['公募']   !== undefined ? boolBadge('公募',  '公募',   d['公募'], 'purple') : ''}
    </div>`;

  top.append(imgWrap, titleArea);
  card.appendChild(top);

  // ── detail grid ──
  const skip = new Set([...HIDDEN_KEYS, ...BADGE_KEYS, '名前']);
  const rows  = Object.keys(d).filter(k => !k.startsWith('_') && !skip.has(k));
  if (rows.length) {
    const grid = document.createElement('div');
    grid.className = 'detail-grid';
    rows.forEach(k => {
      const dl = Object.assign(document.createElement('div'), { className: 'dl', textContent: k });
      const dd = Object.assign(document.createElement('div'), { className: 'dd', textContent: convertValue(k, d[k]) });
      grid.append(dl, dd);
    });
    card.appendChild(grid);
  }

  resultEl.innerHTML = '';
  resultEl.appendChild(card);

  // モバイルでカードが見えるようにスクロール
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}
</script>
