<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ff6eb4" />
<title>ここたま検索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --pink:       #ff6eb4;
  --pink-lt:    #ffe4f2;
  --pink-dk:    #d4006a;
  --pink-pale:  #fff7fb;
  --yellow:     #ffd746;
  --yellow-lt:  #fff9d6;
  --yellow-dk:  #b8860b;
  --green:      #7ecb6e;
  --green-lt:   #dff5d8;
  --green-dk:   #3a7a2a;
  --blue:       #74b8f7;
  --blue-lt:    #ddf0ff;
  --purple:     #c18ef7;
  --purple-lt:  #f0e4ff;
  --orange:     #ffab4e;
  --text:       #3a1a2e;
  --text-sub:   #a07890;
  --border:     #f5d0e8;
  --bg:         #fffbfd;
  --card:       #ffffff;
  --shadow-sm:  0 2px 12px rgba(255,110,180,.13);
  --shadow-md:  0 8px 32px rgba(255,110,180,.2);
  --shadow-lg:  0 20px 60px rgba(255,110,180,.28);
  --safe-top:   env(safe-area-inset-top, 0px);
  --safe-bot:   env(safe-area-inset-bottom, 0px);
  --r-card:     20px;
  --r-pill:     999px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  font-family: 'M PLUS Rounded 1c', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-overflow-scrolling: touch;
  background-image:
    radial-gradient(circle at 10% 10%, rgba(255,212,62,.08) 0%, transparent 40%),
    radial-gradient(circle at 90% 5%, rgba(255,110,180,.07) 0%, transparent 35%),
    radial-gradient(circle at 50% 95%, rgba(116,184,247,.06) 0%, transparent 40%);
}

/* ─── HEADER ─── */
.site-header {
  background: linear-gradient(90deg, #ff6eb4 0%, #ffab4e 50%, #ffd43e 100%);
  padding: calc(8px + var(--safe-top)) 20px 8px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 3px 18px rgba(255,110,180,.35);
}

.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 14px;
}

.site-logo {
  font-family: 'Kaisei Decol', serif;
  font-size: 1.25rem; color: #fff;
  white-space: nowrap; flex-shrink: 0;
  text-shadow: 0 2px 8px rgba(0,0,0,.18);
  letter-spacing: .04em;
  display: flex; align-items: center; gap: 6px;
}

.logo-egg { font-size: 1.5rem; animation: eggBounce 2.4s ease-in-out infinite; display: inline-block; }
@keyframes eggBounce {
  0%,100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-6px) rotate(5deg); }
}

/* ─── HERO ─── */
.hero {
  background: linear-gradient(160deg, #ff6eb4 0%, #ffab4e 45%, #ffd43e 100%);
  padding: 32px 20px 42px; text-align: center;
  position: relative; overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 15% 70%, rgba(255,255,255,.22) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 25%, rgba(255,255,255,.15) 0%, transparent 45%);
  pointer-events: none;
}

/* floating decorations */
.hero-deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.hero-deco span {
  position: absolute; font-style: normal;
  animation: floatItem 5s ease-in-out infinite;
  opacity: .55;
}
.hero-deco span:nth-child(1) { top:8%; left:5%; font-size:2rem; animation-delay:0s; }
.hero-deco span:nth-child(2) { top:70%; left:3%; font-size:1.4rem; animation-delay:1s; }
.hero-deco span:nth-child(3) { top:15%; right:6%; font-size:2.2rem; animation-delay:2s; }
.hero-deco span:nth-child(4) { top:75%; right:4%; font-size:1.6rem; animation-delay:.5s; }
.hero-deco span:nth-child(5) { top:45%; left:45%; font-size:1.2rem; animation-delay:1.7s; }
.hero-deco span:nth-child(6) { top:30%; left:15%; font-size:1rem; animation-delay:2.8s; }
.hero-deco span:nth-child(7) { top:60%; right:18%; font-size:1.1rem; animation-delay:3.5s; }

@keyframes floatItem {
  0%,100% { transform: translateY(0) scale(1) rotate(-5deg); }
  50% { transform: translateY(-14px) scale(1.2) rotate(8deg); }
}

.hero-title-wrap { position: relative; z-index: 1; }
.hero h1 {
  font-family: 'Kaisei Decol', serif;
  font-size: clamp(1.9rem, 6vw, 3.2rem); color: #fff;
  text-shadow: 0 3px 20px rgba(180,60,0,.25), 0 0 40px rgba(255,255,255,.3);
  letter-spacing: .08em; line-height: 1.15;
}
.hero-sub {
  color: rgba(255,255,255,.9); font-size: .9rem;
  margin-top: 8px; font-weight: 700;
  text-shadow: 0 1px 6px rgba(0,0,0,.15);
  position: relative; z-index: 1;
}

.hero-count {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.3); border: 2px solid rgba(255,255,255,.55);
  border-radius: 999px; padding: 6px 20px; margin-top: 14px;
  font-size: .84rem; font-weight: 800; color: #fff;
  position: relative; z-index: 1;
  text-shadow: 0 1px 4px rgba(0,0,0,.12);
  backdrop-filter: blur(4px);
}

/* ─── SEARCH BAR (below hero, above content) ─── */
.search-section {
  background: linear-gradient(180deg, rgba(255,110,180,.08) 0%, transparent 100%);
  padding: 20px 20px 4px;
  border-bottom: 2px dashed var(--border);
}

.fortune-section {
  max-width: 1100px;
  margin: 14px auto 0;
  padding: 0 16px;
}
.fortune-card-wrap {
  background: #fff;
  border: 3px solid var(--pink-lt);
  border-radius: 24px;
  box-shadow: var(--shadow-sm);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.fortune-title {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Kaisei Decol', serif;
  font-size: 1.25rem;
  color: var(--pink-dk);
}
.fortune-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.fortune-btn {
  border: none;
  border-radius: 999px;
  padding: 10px 18px;
  font-family: inherit;
  font-weight: 800;
  cursor: pointer;
}
.fortune-btn.login {
  background: #111;
  color: #fff;
}
.fortune-btn.run {
  background: linear-gradient(135deg, var(--pink), var(--orange));
  color: #fff;
}
.fortune-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.fortune-status {
  font-size: .85rem;
  font-weight: 700;
  color: var(--text-sub);
}
.fortune-state {
  min-height: 20px;
  font-size: .82rem;
  font-weight: 700;
  color: var(--text-sub);
}
.fortune-state.error {
  color: #c4205f;
}
.fortune-result {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 8px;
}
.fortune-result-card {
  border: 2px solid var(--border);
  border-radius: 14px;
  background: var(--pink-pale);
  padding: 10px 12px;
}
.fortune-result-card h4 {
  font-size: .75rem;
  color: var(--pink-dk);
  margin-bottom: 4px;
}
.fortune-result-card p {
  font-size: .82rem;
  line-height: 1.5;
}

.search-wrap {
  max-width: 680px; margin: 0 auto;
  display: flex; align-items: center;
  background: #fff; border: 3px solid var(--pink);
  border-radius: 999px; padding: 8px 16px 8px 22px; gap: 10px;
  box-shadow: 0 4px 20px rgba(255,110,180,.2), 0 0 0 5px rgba(255,110,180,.08);
  transition: box-shadow .2s, border-color .2s;
}
.search-wrap:focus-within {
  border-color: var(--pink-dk);
  box-shadow: 0 4px 24px rgba(255,110,180,.3), 0 0 0 6px rgba(255,110,180,.12);
}
.search-icon { flex-shrink: 0; color: var(--pink); }
#search {
  flex: 1; min-width: 0; border: none; outline: none;
  font-family: inherit; font-size: 17px; font-weight: 700;
  background: transparent; color: var(--text);
}
#search::placeholder { color: #e0a8c8; font-weight: 500; }
.header-clear {
  width: 28px; height: 28px; border-radius: 50%;
  border: none; background: var(--pink-lt);
  color: var(--pink-dk); font-size: .82rem; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  transition: background .15s; font-weight: 700;
}
.header-clear:hover { background: var(--pink); color: #fff; }
.header-clear.show { display: flex; }

/* ─── LAYOUT ─── */
.page-body {
  max-width: 1100px; margin: 0 auto;
  padding: 22px 16px calc(50px + var(--safe-bot));
  display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start;
}
@media (max-width: 768px) { .page-body { grid-template-columns: 1fr; gap: 12px; } }

/* ─── SIDEBAR ─── */
.sidebar {
  background: var(--card);
  border: 3px solid var(--pink-lt);
  border-radius: 24px; overflow: hidden;
  box-shadow: var(--shadow-sm);
  position: sticky; top: 60px;
}

.sidebar-head {
  background: linear-gradient(135deg, var(--pink) 0%, var(--orange) 100%);
  padding: 12px 18px;
  display: flex; align-items: center; gap: 8px;
}
.sidebar-head h2 {
  font-family: 'Kaisei Decol', serif;
  color: #fff; font-size: 1rem; letter-spacing: .05em;
  text-shadow: 0 1px 6px rgba(0,0,0,.15);
}
.sidebar-head-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,.3);
  display: flex; align-items: center; justify-content: center;
  font-size: .95rem;
}

.sidebar-body { padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 14px; }

.sf-group { display: flex; flex-direction: column; gap: 7px; }
.sf-label {
  font-size: .75rem; font-weight: 800; color: var(--text-sub);
  letter-spacing: .06em; display: flex; align-items: center; gap: 5px;
  text-transform: uppercase;
}
.sf-label-dot {
  width: 4px; height: 14px;
  background: linear-gradient(180deg, var(--pink), var(--orange));
  border-radius: 3px; flex-shrink: 0;
}

.sf-pills { display: flex; gap: 5px; flex-wrap: wrap; }

.sf-pill {
  padding: 5px 13px; border-radius: 999px;
  border: 2.5px solid var(--border); background: #fff;
  color: var(--text-sub); font-family: inherit;
  font-size: .76rem; font-weight: 800; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: all .15s; min-height: 34px;
}
.sf-pill:hover { border-color: var(--pink); color: var(--pink); background: var(--pink-pale); }
.sf-pill.on {
  background: linear-gradient(135deg, var(--pink), var(--orange));
  border-color: transparent; color: #fff;
  box-shadow: 0 3px 12px rgba(255,110,180,.35);
}
.sf-pill.on.green {
  background: linear-gradient(135deg, var(--green), #4caf50);
  box-shadow: 0 3px 12px rgba(126,203,110,.4);
}
.sf-pill.on.purple {
  background: linear-gradient(135deg, var(--purple), #8b5cf6);
  box-shadow: 0 3px 12px rgba(193,142,247,.4);
}
.sf-pill.on.blue {
  background: linear-gradient(135deg, var(--blue), #3b82f6);
  box-shadow: 0 3px 12px rgba(116,184,247,.4);
}

.sf-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  margin: 2px 0;
}

.sf-reset {
  width: 100%; padding: 10px; border-radius: 14px;
  border: 2.5px solid var(--border); background: var(--pink-pale);
  color: var(--text-sub); font-family: inherit;
  font-size: .82rem; font-weight: 800; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: all .15s; min-height: 40px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.sf-reset:hover {
  border-color: var(--pink); color: var(--pink-dk);
  background: var(--pink-lt);
}

/* mobile toggle */
.mobile-filter-btn {
  display: none; width: 100%; padding: 12px 18px;
  background: linear-gradient(135deg, var(--pink) 0%, var(--orange) 100%);
  border: none; border-radius: 20px;
  box-shadow: var(--shadow-sm);
  font-family: inherit; font-size: .88rem; font-weight: 800;
  color: #fff; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  align-items: center; justify-content: space-between; gap: 8px;
  transition: all .15s;
}
.mobile-filter-btn .arrow { transition: transform .22s; }
.mobile-filter-btn.open .arrow { transform: rotate(180deg); }
@media (max-width: 768px) {
  .mobile-filter-btn { display: flex; }
  .sidebar { position: static; display: none; }
  .sidebar.open { display: block; }
}

/* ─── MAIN ─── */
.main-area { display: flex; flex-direction: column; gap: 14px; }

.result-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.result-count { font-size: .85rem; font-weight: 700; color: var(--text-sub); }
.result-count strong { color: var(--pink); font-size: 1.2em; }

.sort-wrap {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--pink-pale); border: 2px solid var(--border);
  border-radius: 999px; padding: 8px 12px;
  font-size: .82rem; color: var(--text-sub);
}
.sort-wrap label { white-space: nowrap; }
.sort-wrap select {
  border: none; outline: none; background: transparent;
  font: inherit; color: inherit; cursor: pointer;
}

.active-badges { display: flex; flex-wrap: wrap; gap: 5px; }
.a-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--pink-lt); color: var(--pink-dk);
  border-radius: 999px; font-size: .72rem; font-weight: 800;
  padding: 3px 8px 3px 11px;
  border: 1.5px solid rgba(255,110,180,.3);
}
.a-badge button {
  background: none; border: none; cursor: pointer;
  color: var(--pink-dk); font-size: .88rem; line-height: 1;
  -webkit-tap-highlight-color: transparent; padding: 0 0 0 3px;
}

/* ─── GRID ─── */
.chara-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
@media (max-width: 480px) {
  .chara-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 9px; }
}

.chara-card {
  background: var(--card);
  border: 3px solid var(--pink-lt);
  border-radius: var(--r-card); overflow: hidden; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s, box-shadow .2s, border-color .2s;
  animation: cardIn .35s ease both;
}
.chara-card:hover {
  transform: translateY(-6px) scale(1.04);
  box-shadow: var(--shadow-md);
  border-color: var(--pink);
}

@keyframes cardIn {
  from { opacity: 0; transform: scale(.88) translateY(14px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.chara-img-wrap {
  aspect-ratio: 1;
  background: linear-gradient(135deg, var(--pink-lt) 0%, var(--yellow-lt) 60%, var(--green-lt) 100%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.chara-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
.chara-placeholder { font-size: 3rem; }

.chara-gender {
  position: absolute; top: 6px; right: 6px;
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .62rem; font-weight: 800;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.chara-gender.f { background: var(--pink); color: #fff; }
.chara-gender.m { background: var(--blue); color: #fff; }

.chara-minibadges {
  position: absolute; bottom: 5px; left: 5px;
  display: flex; gap: 3px;
}
.mb {
  font-size: .53rem; font-weight: 800; padding: 2px 6px;
  border-radius: 999px; line-height: 1.4;
}
.mb.g { background: var(--green); color: #fff; }
.mb.p { background: var(--purple); color: #fff; }
.mb.y { background: var(--yellow); color: #fff; }

.chara-info {
  padding: 7px 9px 9px;
  border-top: 2px solid var(--pink-lt);
  background: linear-gradient(180deg, #fff 0%, var(--pink-pale) 100%);
}
.chara-name { font-family: 'Kaisei Decol', serif; font-size: .88rem; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-sub); grid-column: 1/-1; }
.empty-state .icon { font-size: 4rem; margin-bottom: 14px; }
.empty-state p { font-weight: 700; line-height: 1.8; }

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(58, 26, 46, .6); backdrop-filter: blur(6px);
  z-index: 500; display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none; transition: opacity .25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--card); border-radius: 26px;
  max-width: 510px; width: 100%; max-height: 90vh;
  overflow-y: auto; box-shadow: var(--shadow-lg);
  transform: scale(.88) translateY(30px);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  scrollbar-width: thin; scrollbar-color: var(--pink-lt) transparent;
  border: 3px solid var(--pink-lt);
}
.modal-overlay.open .modal { transform: scale(1) translateY(0); }

.modal-header {
  background: linear-gradient(135deg, var(--pink) 0%, var(--orange) 60%, var(--yellow) 100%);
  padding: 20px 18px 18px;
  display: flex; gap: 14px; align-items: flex-start; position: relative;
}
.modal-close {
  position: absolute; top: 12px; right: 13px;
  width: 32px; height: 32px; border-radius: 50%;
  border: none; background: rgba(255,255,255,.3);
  color: #fff; font-size: 1rem; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s; font-weight: 700;
}
.modal-close:hover { background: rgba(255,255,255,.5); }

.modal-img-wrap {
  width: 88px; height: 88px; flex-shrink: 0;
  border-radius: 18px; background: rgba(255,255,255,.28);
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
}
.modal-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
.modal-placeholder { font-size: 2.8rem; }

.modal-title-area { flex: 1; min-width: 0; padding-top: 2px; }
.modal-name {
  font-family: 'Kaisei Decol', serif;
  font-size: 1.55rem; color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,.18); line-height: 1.2;
}
.modal-en { font-size: .78rem; color: rgba(255,255,255,.75); margin-top: 3px; }
.modal-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.m-badge {
  display: inline-flex; align-items: center;
  border-radius: 999px; font-size: .73rem; font-weight: 800; padding: 4px 11px;
}
.m-badge.w { background: rgba(255,255,255,.3); color: #fff; border: 1.5px solid rgba(255,255,255,.4); }
.m-badge.g { background: rgba(126,203,110,.3); color: #e8ffdf; border: 1.5px solid rgba(126,203,110,.4); }
.m-badge.p { background: rgba(193,142,247,.25); color: rgba(255,255,255,.9); border: 1.5px solid rgba(193,142,247,.4); }
.m-badge.y { background: rgba(255,212,62,.25); color: #fff; border: 1.5px solid rgba(255,212,62,.4); }

.modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

/* spell */
.spell-block {
  background: linear-gradient(135deg, var(--yellow-lt), var(--pink-lt));
  border: 2.5px dashed var(--yellow); border-radius: 18px;
  padding: 14px 16px; text-align: center;
  position: relative; overflow: hidden;
}
.spell-block::before {
  content: '✨'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 1.4rem; opacity: .6;
}
.spell-block::after {
  content: '✨'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 1.4rem; opacity: .6;
}
.spell-label { font-size: .7rem; font-weight: 800; color: var(--text-sub); letter-spacing: .06em; margin-bottom: 6px; }
.spell-text { font-family: 'Kaisei Decol', serif; font-size: 1rem; color: var(--pink-dk); line-height: 1.6; font-weight: 700; }

/* honmyo */
.honmyo-block {
  background: var(--purple-lt); border: 2.5px solid #e0c8ff;
  border-radius: 16px; padding: 12px 15px;
}
.honmyo-label { font-size: .7rem; font-weight: 800; color: #7c3aed; letter-spacing: .05em; margin-bottom: 4px; }
.honmyo-text { font-size: .86rem; color: #5b21b6; line-height: 1.5; }

/* detail table */
.detail-table {
  display: grid; grid-template-columns: auto 1fr;
  gap: 1px; background: var(--border);
  border-radius: 16px; overflow: hidden; border: 2px solid var(--border);
}
.dt-k {
  background: linear-gradient(135deg, var(--pink-pale), var(--yellow-lt));

}
.dt-v { background: #fff; padding: 9px 13px; font-size: .84rem; word-break: break-all; }

/* ─── SECTION TITLE CHIPS (decorative) ─── */
.section-chip {

  background: linear-gradient(135deg, var(--pink), var(--orange));
  color: #fff; border-radius: 999px; padding: 4px 14px 4px 10px;

}

@media (max-width: 480px) { .modal-name { font-size: 1.25rem; } }
@media (pointer: coarse) {

}
</style>
</head>

<script>
let allData = [];
let matchMode = 'prefix';
let filters = {};
let query = '';
let sortOrder = 'nameAsc';

const searchEl   = document.getElementById('search');
const clearBtn   = document.getElementById('clearBtn');
const charaGrid  = document.getElementById('charaGrid');
const resultCount= document.getElementById('resultCount');
const heroCount  = document.getElementById('heroCount');
const activeBadges=document.getElementById('activeBadges');
const sortSelect = document.getElementById('sortSelect');
const modalOverlay=document.getElementById('modalOverlay');
const modal      = document.getElementById('modal');
const mobileFilterBtn=document.getElementById('mobileFilterBtn');
const sidebar    = document.getElementById('sidebar');
const xLoginBtn  = document.getElementById('xLoginBtn');
const fortuneBtn = document.getElementById('fortuneBtn');
const loginStatus= document.getElementById('loginStatus');
const fortuneState=document.getElementById('fortuneState');
const fortuneResult=document.getElementById('fortuneResult');
let authUser = null;

/* converters */
function toHiragana(str){
  return str.replace(/[\u30A1-\u30F6]/g,m=>String.fromCharCode(m.charCodeAt(0)-0x60));
}
function toRomaji(str){
  const map={あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'wo',ん:'n'};
  return str.split('').map(c=>map[c]||c).join('');
}
function convertValue(key,value){
  if(key==='性別'){ if(value==='1')return'♀ 女の子'; if(value==='0')return'♂ 男の子'; return'不明'; }
  if(key==='一人前'){ if(value==='1')return'🌟 一人前'; if(value==='0')return'🥚 見習い'; return'不明'; }
  if(key==='公募'){ if(value==='1')return'○ あり'; if(value==='2')return'スタッフ'; if(value==='0')return'× なし'; return'不明'; }
  if(key==='魔法の呪文'){ if(value==='1')return'ここんぽいぽいここったま！'; if(!value||value==='0')return'不明'; return value; }
  return value&&value.trim()!==''?value:'不明';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function setFortuneMessage(message,isError=false){
  fortuneState.textContent=message;
  fortuneState.classList.toggle('error',isError);
}

function renderFortuneResult(payload){
  const {fortune,meta,user}=payload;
  fortuneResult.hidden=false;
  fortuneResult.innerHTML=`
    <article class="fortune-result-card"><h4>全体運</h4><p>${esc(fortune.overall||'')}</p></article>
    <article class="fortune-result-card"><h4>恋愛運</h4><p>${esc(fortune.love||'')}</p></article>
    <article class="fortune-result-card"><h4>仕事・学業運</h4><p>${esc(fortune.work||'')}</p></article>
    <article class="fortune-result-card"><h4>ラッキーアクション</h4><p>${esc(fortune.lucky_action||'')}</p></article>
    <article class="fortune-result-card"><h4>ラッキーカラー</h4><p>${esc(fortune.lucky_color||'')}</p></article>
    <article class="fortune-result-card"><h4>メモ</h4><p>${esc((user?.name||'あなた')+' さん向け / '+(meta?.fallbackUsed?'テンプレート占い':'AI占い'))}</p></article>`;
}

function updateLoginUI(authenticated,user){
  authUser=authenticated?user:null;
  loginStatus.textContent=authenticated
    ?`ログイン中: @${user?.username||'user'}`
    :'ログイン状態: 未ログイン';
  fortuneBtn.disabled=!authenticated;
}

async function refreshAuthStatus(){
  try{
    const res=await fetch('/api/auth/me',{credentials:'same-origin'});
    const data=await res.json();
    updateLoginUI(Boolean(data.authenticated),data.user||null);
    if(data.authenticated){
      setFortuneMessage('ログイン済みです。占いボタンで今日の運勢を確認できます。');
    }else{
      setFortuneMessage('ログイン後に占いを実行できます。');
      fortuneResult.hidden=true;
      fortuneResult.innerHTML='';
    }
  }catch{
    updateLoginUI(false,null);
    setFortuneMessage('ログイン状態の取得に失敗しました。再読み込みしてください。',true);
  }
}

/* CSV load */
fetch('cocotama.csv')
  .then(r=>r.text())
  .then(text=>{
    const lines=text.trim().split('\n');
    const headers=lines[0].split(',');
    allData=lines.slice(1).map(line=>{
      const values=line.split(',');
      const obj={};
      headers.forEach((h,i)=>obj[h]=(values[i]||'').trim());
      obj._hira=toHiragana(obj['名前']||'');
      obj._roma=toRomaji(obj._hira);
      return obj;
    });
    allData.sort((a,b)=>a._hira.localeCompare(b._hira,'ja'));
    heroCount.textContent=`全 ${allData.length} キャラクター`;
    render();
  })
  .catch(()=>{
    heroCount.textContent='データ読み込みエラー';
    charaGrid.innerHTML='<div class="empty-state"><div class="icon">⚠️</div><p>cocotama.csv が見つかりません</p></div>';
  });

/* filter match */
function matchFilter(d){
  for(const [key,vals] of Object.entries(filters)){
    if(!vals||vals.size===0)continue;
    let ok=false;
    for(const raw of vals){
      if(raw===d[key]){ ok=true; break; }
    }
    if(!ok)return false;
  }
  return true;
}

/* search */
function fuzzyScore(target,q){
  let ti=0,qi=0,score=0;
  while(ti<target.length&&qi<q.length){ if(target[ti]===q[qi]){score++;qi++;} ti++; }
  return qi===q.length?score/target.length:-1;
}
function getResults(){
  let pool=allData.filter(matchFilter);
  if(!query){
    return sortResults(pool);
  }
  const ql=query.toLowerCase(),qh=toHiragana(ql),qr=toRomaji(qh);
  if(matchMode==='prefix') return sortResults(pool.filter(d=>d['名前'].startsWith(query)||d._hira.startsWith(qh)||d._roma.startsWith(qr)));
  if(matchMode==='partial') return sortResults(pool.filter(d=>d['名前'].includes(query)||d._hira.includes(qh)||d._roma.includes(qr)));
  const scored=pool.map(d=>({d,s:Math.max(fuzzyScore(d['名前'],query),fuzzyScore(d._hira,qh),fuzzyScore(d._roma,qr))})).filter(x=>x.s>=0);
  scored.sort((a,b)=>b.s-a.s);
  const fuzzyResults=scored.map(x=>x.d);
  return sortResults(fuzzyResults);
}

function sortResults(results){
  const sorted=[...results];
  if(sortOrder==='nameAsc'){
    return sorted.sort((a,b)=>a._hira.localeCompare(b._hira,'ja'));
  }
  if(sortOrder==='nameDesc'){
    return sorted.sort((a,b)=>b._hira.localeCompare(a._hira,'ja'));
  }
  if(sortOrder==='enAsc'){
    return sorted.sort((a,b)=>{
      const aEn=a['EN-Name']&&a['EN-Name']!=='0'?a['EN-Name']:'';
      const bEn=b['EN-Name']&&b['EN-Name']!=='0'?b['EN-Name']:'';
      return aEn.localeCompare(bEn,'en', {sensitivity:'base'}) || a._hira.localeCompare(b._hira,'ja');
    });
  }
  if(sortOrder==='enDesc'){
    return sorted.sort((a,b)=>{
      const aEn=a['EN-Name']&&a['EN-Name']!=='0'?a['EN-Name']:'';
      const bEn=b['EN-Name']&&b['EN-Name']!=='0'?b['EN-Name']:'';
      return bEn.localeCompare(aEn,'en', {sensitivity:'base'}) || a._hira.localeCompare(b._hira,'ja');
    });
  }
  return results;
}

/* render grid */
function render(){
  const results=getResults();
  resultCount.innerHTML=`<strong>${results.length}</strong> 件見つかりました`;
  if(!results.length){
    charaGrid.innerHTML='<div class="empty-state"><div class="icon">😢</div><p>条件に一致するここたまがいません<br>検索条件を変えてみてね！</p></div>';
    return;
  }
  charaGrid.innerHTML='';
  results.forEach((d,i)=>{
    const card=document.createElement('div');
    card.className='chara-card';
    card.style.animationDelay=`${Math.min(i*16,260)}ms`;
    const isF=d['性別']==='1',isM=d['性別']==='0';
    const isFull=d['一人前']==='1';
    const kouboVal=d['公募'];
    const hasKoubo1=kouboVal==='1';
    const hasKoubo2=kouboVal==='2';
    const enName=d['EN-Name']&&d['EN-Name']!=='0'?d['EN-Name']:'';
    card.innerHTML=`
      <div class="chara-img-wrap">
        ${enName
          ?`<img src="images/${esc(enName)}.webp"
               onerror="this.src='images/${esc(enName)}.png';this.onerror=function(){this.src='images/${esc(enName)}.jpg';this.onerror=function(){this.style.display='none';this.parentElement.querySelector('.chara-placeholder').style.display='';}};"
               alt="${esc(d['名前'])}"><span class="chara-placeholder" style="display:none">🌟</span>`
          :`<span class="chara-placeholder">⭐️</span>`}
        <span class="chara-gender ${isF?'f':isM?'m':''}">${isF?'♀':isM?'♂':'？'}</span>
        <div class="chara-minibadges">
          ${isFull?'<span class="mb g">一人前</span>':''}
          ${hasKoubo1?'<span class="mb p">公募</span>':''}
          ${hasKoubo2?'<span class="mb y">スタッフ</span>':''}
        </div>
      </div>
      <div class="chara-info">
        <div class="chara-name">${esc(d['名前'])}</div>
      </div>`;
    card.addEventListener('click',()=>openModal(d));
    charaGrid.appendChild(card);
  });
}

/* badges */
const BADGE_LABELS={'性別':{'1':'♀ 女の子','0':'♂ 男の子'},'一人前':{'1':'🌟 一人前','0':'🥚 見習い'},'公募':{'1':'○ あり','2':'スタッフ','0':'× なし'}};
function renderBadges(){
  activeBadges.innerHTML='';
  for(const [key,vals] of Object.entries(filters)){
    if(!vals||vals.size===0)continue;
    vals.forEach(raw=>{
      const map=BADGE_LABELS[key];
      const text=map?map[raw]||raw:raw;
      const badge=document.createElement('span');
      badge.className='a-badge';
      badge.innerHTML=`${esc(key)}：${esc(text)}<button aria-label="削除">✕</button>`;
      badge.querySelector('button').addEventListener('click',()=>removeBadge(key,raw));
      activeBadges.appendChild(badge);
    });
  }
}
function removeBadge(key,raw){
  filters[key]?.delete(raw);
  document.querySelectorAll(`.sf-pill[data-filter="${key}"][data-val="${raw}"]`).forEach(p=>p.classList.remove('on'));
  renderBadges(); render();
}

/* modal */
const MODAL_SKIP=new Set(['名前','EN-Name','_hira','_roma','性別','一人前','公募','魔法の呪文','本名','何から生まれたか']);
function openModal(d){
  const isF=d['性別']==='1',isM=d['性別']==='0';
  const isFull=d['一人前']==='1';
  const koubo=convertValue('公募',d['公募']);
  const spell=convertValue('魔法の呪文',d['魔法の呪文']);
  const hasSpell=d['魔法の呪文']&&d['魔法の呪文']!=='0'&&d['魔法の呪文']!=='';
  const hasHonmyo=d['本名']&&d['本名']!=='0'&&d['本名']!=='';
  const birth=d['何から生まれたか']&&d['何から生まれたか']!=='0'?d['何から生まれたか']:'';
  const enName=d['EN-Name']&&d['EN-Name']!=='0'?d['EN-Name']:'';
  const rows=Object.keys(d).filter(k=>!MODAL_SKIP.has(k)&&!k.startsWith('_'));

  modal.innerHTML=`
    <div class="modal-header">
      <button class="modal-close" id="modalClose" aria-label="閉じる">✕</button>
      <div class="modal-img-wrap">
        ${enName
          ?`<img src="images/${esc(enName)}.webp"
               onerror="this.src='images/${esc(enName)}.png';this.onerror=function(){this.src='images/${esc(enName)}.jpg';this.onerror=function(){this.style.display='none';this.parentElement.querySelector('.modal-placeholder').style.display='';}};"
               alt="${esc(d['名前'])}"><span class="modal-placeholder" style="display:none">🌟</span>`
          :`<span class="modal-placeholder">🌟</span>`}
      </div>
      <div class="modal-title-area">
        <div class="modal-name">${esc(d['名前'])}</div>
        ${enName?`<div class="modal-en">${esc(enName)}</div>`:''}
        <div class="modal-badges">
          <span class="m-badge w">${isF?'♀ 女の子':isM?'♂ 男の子':'性別不明'}</span>
          ${isFull?'<span class="m-badge g">🌟 一人前</span>':'<span class="m-badge y">🥚 見習い中</span>'}
          <span class="m-badge p">公募：${esc(koubo)}</span>
        </div>
      </div>
    </div>
    <div class="modal-body">
      ${birth?`<div class="honmyo-block" style="background:var(--yellow-lt);border-color:var(--yellow);">
        <div class="honmyo-label" style="color:var(--yellow-dk);">🥚 何から生まれたか</div>
        <div class="honmyo-text" style="color:#7a5a00;">${esc(birth)}</div>
      </div>`:''}
      ${hasSpell?`<div class="spell-block">
        <div class="spell-label">✨ 魔法の呪文 ✨</div>
        <div class="spell-text">${esc(spell)}</div>
      </div>`:''}
      ${hasHonmyo?`<div class="honmyo-block">
        <div class="honmyo-label">👑 本名</div>
        <div class="honmyo-text">${esc(d['本名'])}</div>
      </div>`:''}
      ${rows.length?`<div class="detail-table">${rows.map(k=>`<div class="dt-k">${esc(k)}</div><div class="dt-v">${esc(convertValue(k,d[k]))}</div>`).join('')}</div>`:''}
    </div>`;

  document.getElementById('modalClose').addEventListener('click',closeModal);
  modalOverlay.classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  modalOverlay.classList.remove('open');
  document.body.style.overflow='';
}

modalOverlay.addEventListener('click',e=>{ if(e.target===modalOverlay)closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });

/* search events */
searchEl.addEventListener('input',()=>{
  query=searchEl.value;
  clearBtn.classList.toggle('show',query.length>0);
  render();
});
clearBtn.addEventListener('click',()=>{
  searchEl.value=query='';
  clearBtn.classList.remove('show');
  render(); searchEl.focus();
});
sortSelect.addEventListener('change',()=>{
  sortOrder=sortSelect.value;
  render();
});

/* mode pills */
document.querySelectorAll('.sf-pill[data-mode]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    matchMode=btn.dataset.mode;
    document.querySelectorAll('.sf-pill[data-mode]').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); render();
  });
});

/* filter pills */
const SINGLE_KEYS=new Set(['性別','一人前','公募']);
document.querySelectorAll('.sf-pill[data-filter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const {filter,val}=btn.dataset;
    if(!filters[filter])filters[filter]=new Set();
    const s=filters[filter];
    if(SINGLE_KEYS.has(filter)){
      if(s.has(val)){ s.delete(val); btn.classList.remove('on'); }
      else {
        document.querySelectorAll(`.sf-pill[data-filter="${filter}"]`).forEach(p=>p.classList.remove('on'));
        s.clear(); s.add(val); btn.classList.add('on');
      }
    } else {
      if(s.has(val)){ s.delete(val); btn.classList.remove('on'); }
      else { s.add(val); btn.classList.add('on'); }
    }
    renderBadges(); render();
  });
});

/* reset */
document.getElementById('resetBtn').addEventListener('click',()=>{
  filters={};
  document.querySelectorAll('.sf-pill[data-filter]').forEach(p=>p.classList.remove('on'));
  renderBadges(); render();
});

/* fortune */
xLoginBtn.addEventListener('click',()=>{
  setFortuneMessage('Xログインへ移動します…');
  window.location.href='/api/auth/x/start';
});

fortuneBtn.addEventListener('click',async()=>{
  if(!authUser)return;
  fortuneBtn.disabled=true;
  setFortuneMessage('占いを生成中です…');
  try{
    const res=await fetch('/api/fortune/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'same-origin',
      body:JSON.stringify({trigger:'manual'})
    });
    const data=await res.json();
    if(!res.ok){
      throw new Error(data.error||'占い生成に失敗しました');
    }
    renderFortuneResult(data);
    setFortuneMessage(data.meta?.fallbackUsed?'テンプレート占いを表示しました。':'AI占いを表示しました。');
  }catch(err){
    setFortuneMessage(err.message||'占い生成に失敗しました',true);
  }finally{
    fortuneBtn.disabled=!authUser;
  }
});

const pageParams=new URLSearchParams(window.location.search);
if(pageParams.get('fortune_error')){
  setFortuneMessage('Xログインに失敗しました。もう一度お試しください。',true);
}
if(pageParams.get('fortune_auth')==='success'){
  setFortuneMessage('Xログインに成功しました。占いを実行できます。');
}
if(pageParams.has('fortune_error')||pageParams.has('fortune_auth')){
  const cleanUrl=window.location.pathname+window.location.hash;
  window.history.replaceState({},'',cleanUrl);
}
refreshAuthStatus();

/* mobile filter */
mobileFilterBtn.addEventListener('click',()=>{
  const open=sidebar.classList.toggle('open');
  mobileFilterBtn.classList.toggle('open',open);
  mobileFilterBtn.setAttribute('aria-expanded',String(open));
});
</script>
</body>
</html>
