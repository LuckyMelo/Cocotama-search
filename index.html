<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ここたま検索</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input { width: 320px; padding: 8px; font-size: 16px; }
    ul { list-style: none; padding: 0; margin: 0; width: 320px; border: 1px solid #ccc; max-height: 240px; overflow-y: auto; position: absolute; background: #fff; }
    li { cursor: pointer; padding: 6px; }
    li.active { background: #eee; }
    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      max-width: 520px;
    }
    .card img {
      max-width: 200px;
      display: block;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<h1>ここたま検索</h1>
<div style="position: relative;">
  <input id="search" placeholder="名前を入力（ひらがな・ローマ字OK）" autocomplete="off" />
  <ul id="suggest"></ul>
</div>
<div id="result"></div>

<script>
let data = [];
let currentIndex = -1;

fetch("cocotama.csv")
  .then(res => res.text())
  .then(text => {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",");

    data = lines.slice(1).map(line => {
      const values = line.split(",");
      let obj = {};
      headers.forEach((h, i) => obj[h] = values[i]);
      obj._hira = toHiragana(obj["名前"]);
      obj._roma = toRomaji(obj._hira);
      return obj;
    });

    // 50音順（ひらがな基準）でソート
    data.sort((a, b) => a._hira.localeCompare(b._hira, 'ja'));
  });

function toHiragana(str) {
  return str.replace(/[\u30A1-\u30F6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
}

function toRomaji(str) {
  const map = {
    あ:'a',い:'i',う:'u',え:'e',お:'o',
    か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',
    さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',
    た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',
    な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',
    は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',
    ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',
    や:'ya',ゆ:'yu',よ:'yo',
    ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',
    わ:'wa',ん:'n'
  };
  return str.split('').map(c => map[c] || c).join('');
}

function convert(key, value) {
  if (key === "性別") return value === "1" ? "♀" : value === "0" ? "♂" : "不明";
  if (key === "一人前") return value === "1" ? "〇" : value === "0" ? "×" : "不明";
  if (key === "公募") return value === "1" ? "〇" : value === "0" ? "×" : value === "2" ? "スタッフ" : "不明";
  if (key === "魔法の呪文") return value === "1" ? "ここんぽいぽいここったま！" : value === "0" ? "不明" : value;
  if (value === "0") return "不明";
  return value;
}

function createCharacterImage(enName) {
  const exts = ['webp', 'png', 'jpg'];
  const img = document.createElement('img');
  let i = 0;

  function tryLoad() {
    if (i >= exts.length) {
      img.style.display = 'none';
      return;
    }
    img.src = `images/${enName}.${exts[i++]}`;
  }

  img.onerror = tryLoad;
  tryLoad();
  return img;
}

const search = document.getElementById('search');
const suggest = document.getElementById('suggest');
const result = document.getElementById('result');

// フォーカス時：全件50音順表示
search.addEventListener('focus', () => renderSuggestions(data));
search.addEventListener('input', update);

function update() {
  const q = search.value.toLowerCase();
  if (!q) {
    renderSuggestions(data);
    return;
  }

  const filtered = data.filter(d =>
    d['名前'].startsWith(search.value) ||
    d._hira.startsWith(q) ||
    d._roma.startsWith(q)
  );

  renderSuggestions(filtered);
}

function renderSuggestions(list) {
  suggest.innerHTML = '';
  currentIndex = -1;
  list.slice(0, 50).forEach(d => {
    const li = document.createElement('li');
    li.textContent = d['名前'];
    li.onclick = () => show(d);
    suggest.appendChild(li);
  });
}

search.addEventListener('keydown', e => {
  const items = suggest.querySelectorAll('li');
  if (!items.length) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    currentIndex = (currentIndex + 1) % items.length;
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    currentIndex = (currentIndex - 1 + items.length) % items.length;
  } else if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault();
    items[currentIndex]?.click();
    return;
  }

  items.forEach((li, i) => li.classList.toggle('active', i === currentIndex));
});

function show(d) {
  suggest.innerHTML = '';
  search.value = d['名前'];
  result.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';

  // EN-Name を使って画像表示
  if (d['EN-Name']) {
    card.appendChild(createCharacterImage(d['EN-Name']));
  }

  Object.keys(d)
    .filter(k => !k.startsWith('_'))
    .forEach(k => {
      const p = document.createElement('p');
      p.innerHTML = `<strong>${k}</strong>：${convert(k, d[k])}`;
      card.appendChild(p);
    });

  result.appendChild(card);
}
</script>

</body>
</html>
