<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>キャラクター情報検索サイト</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
input { padding: 5px; font-size: 16px; width: 300px; }
ul.suggestions { list-style: none; padding: 0; margin: 0; border: 1px solid #ccc; max-width: 300px; max-height: 200px; overflow-y: auto; position: absolute; background: #fff; z-index: 1000; }
ul.suggestions li { padding: 5px; cursor: pointer; }
ul.suggestions li.highlight { background-color: #eee; }
table { margin-top: 20px; border-collapse: collapse; width: 100%; max-width: 800px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
.highlightText { background-color: yellow; }
</style>
</head>
<body>

<h1>キャラクター情報検索</h1>
<div style="position: relative;">
<input type="text" id="nameInput" placeholder="名前を入力" autocomplete="off">
<ul id="suggestions" class="suggestions"></ul>
</div>
<button onclick="searchCharacter()">検索</button>

<div id="result"></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const csvUrl = "cocotama.csv";
let characters = [];
let selectedIndex = -1;

// CSV読み込み
Papa.parse(csvUrl, {
  download: true,
  header: true,
  complete: function(results) {
    characters = results.data.filter(c => c.名前).map(c => ({
        ...c,
        nameHira: toHiragana(c.名前),
        nameRomaji: toRomaji(toHiragana(c.名前))
    }));
  }
});

// カタカナをひらがなに変換
function toHiragana(str){
  return str.replace(/[\u30A1-\u30F6]/g, match => String.fromCharCode(match.charCodeAt(0)-0x60)).toLowerCase();
}

// 簡易ローマ字変換
function toRomaji(str){
  const map = {
    'あ':'a','い':'i','う':'u','え':'e','お':'o',
    'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
    'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
    'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
    'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
    'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
    'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
    'や':'ya','ゆ':'yu','よ':'yo',
    'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
    'わ':'wa','を':'wo','ん':'n'
  };
  let result = '';
  for(let i=0;i<str.length;i++){
    result += map[str[i]] || str[i];
  }
  return result;
}

// 正規表現用
function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// 検索処理
function searchCharacter(){
  const val = inputField.value.trim().toLowerCase();
  const resultDiv = document.getElementById('result');
  if(!val){ resultDiv.innerHTML='<p>名前を入力してください。</p>'; return; }

  const matches = characters.filter(c => 
      c.名前.startsWith(inputField.value) ||
      c.nameHira.startsWith(val) ||
      c.nameRomaji.startsWith(val)
  );

  if(matches.length===0){ resultDiv.innerHTML='<p>見つかりませんでした。</p>'; return; }

  let html='';
  matches.forEach(c=>{
    html+='<table><tr><th>項目</th><th>情報</th></tr>';
    for(const key in c){
      if(['nameHira','nameRomaji'].includes(key)) continue;
      const value=c[key]?c[key]:'';
      html+=`<tr><td>${key}</td><td>${value}</td></tr>`;
    }
    html+='</table><br>';
  });
  resultDiv.innerHTML=html;
}

// オートコンプリート（頭文字一致）
const inputField=document.getElementById("nameInput");
const suggestionBox=document.getElementById("suggestions");

function updateSuggestions(){
  const val=inputField.value.trim().toLowerCase();
  suggestionBox.innerHTML=''; selectedIndex=-1;
  if(!val) return;

  const suggestions=characters
    .filter(c => c.名前.startsWith(inputField.value) || c.nameHira.startsWith(val) || c.nameRomaji.startsWith(val))
    .map(c=>c.名前)
    .slice(0,20);

  suggestions.forEach(name=>{
    const li=document.createElement("li");
    li.textContent=name;
    li.addEventListener("click",function(){
      inputField.value=name;
      suggestionBox.innerHTML='';
      searchCharacter();
    });
    suggestionBox.appendChild(li);
  });
}

inputField.addEventListener("input",updateSuggestions);

// キー操作（上下/Enter/Tab）
inputField.addEventListener("keydown",function(e){
  const items=suggestionBox.querySelectorAll("li");
  if(items.length===0) return;

  if(e.key==="ArrowDown"){ 
    e.preventDefault(); 
    if(selectedIndex<items.length-1) selectedIndex++; 
    highlightItem(items); 
    scrollToItem(items[selectedIndex]); 
  } else if(e.key==="ArrowUp"){ 
    e.preventDefault(); 
    if(selectedIndex>0) selectedIndex--; 
    highlightItem(items); 
    scrollToItem(items[selectedIndex]); 
  } else if(e.key==="Enter" || e.key==="Tab"){  // Tabでも選択
    e.preventDefault();
    if(selectedIndex>=0){
      inputField.value = items[selectedIndex].textContent;
    }
    suggestionBox.innerHTML='';
    searchCharacter();
  }
});

function highlightItem(items){ items.forEach((li,i)=>li.classList.toggle("highlight",i===selectedIndex)); }

function scrollToItem(item){ 
  if(item){ 
    const c=suggestionBox; 
    const ct=c.scrollTop; 
    const cb=ct+c.offsetHeight; 
    const it=item.offsetTop; 
    const ib=it+item.offsetHeight; 
    if(ib>cb) c.scrollTop+=ib-cb; 
    else if(it<ct) c.scrollTop-=ct-it; 
  } 
}
</script>

</body>
</html>
