<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4d94" />
  <title>ここたま検索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink:      #ff4d94;
      --pink-lt:   #ffe0ef;
      --pink-dk:   #cc1f6a;
      --pink-pale: #fff5f9;
      --purple:    #b96ef7;
      --purple-lt: #f0e6ff;
      --mint:      #2dd4a0;
      --mint-lt:   #d0faf0;
      --yellow:    #ffd23f;
      --yellow-lt: #fff8d6;
      --text:      #2a1428;
      --text-sub:  #9a6e8a;
      --border:    #f2cfe0;
      --bg:        #fff8fb;
      --card:      #ffffff;
      --shadow-sm: 0 2px 10px rgba(255,77,148,.10);
      --shadow-md: 0 6px 28px rgba(255,77,148,.16);
      --shadow-lg: 0 16px 56px rgba(255,77,148,.22);
      --safe-top:  env(safe-area-inset-top, 0px);
      --safe-bot:  env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }

    /* ─── HEADER ─── */
    .site-header {
      background: #fff;
      border-bottom: 2px solid var(--border);
      padding: calc(10px + var(--safe-top)) 20px 10px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; gap: 14px;
    }
    .site-logo {
      font-family: 'Kaisei Decol', serif;
      font-size: 1.35rem; color: var(--pink);
      white-space: nowrap; flex-shrink: 0;
      letter-spacing: .04em;
    }
    .header-search {
      flex: 1; display: flex; align-items: center;
      background: var(--pink-pale); border: 2px solid var(--border);
      border-radius: 999px; padding: 6px 14px 6px 18px; gap: 8px;
      transition: border-color .2s, box-shadow .2s; min-height: 44px;
    }
    .header-search:focus-within {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(255,77,148,.12);
      background: #fff;
    }
    .header-search svg { flex-shrink: 0; color: var(--text-sub); }
    #search {
      flex: 1; min-width: 0; border: none; outline: none;
      font-family: inherit; font-size: 16px;
      background: transparent; color: var(--text);
    }
    #search::placeholder { color: #cca0be; }
    .header-clear {
      width: 26px; height: 26px; border-radius: 50%;
      border: none; background: var(--pink-lt);
      color: var(--pink-dk); font-size: .8rem; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent; flex-shrink: 0;
      transition: background .15s;
    }
    .header-clear:hover { background: var(--pink); color: #fff; }
    .header-clear.show { display: flex; }

    /* ─── HERO ─── */
    .hero {
      background: linear-gradient(135deg, #ff4d94 0%, #b96ef7 55%, #7ac7f9 100%);
      padding: 38px 20px 46px; text-align: center;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 20% 60%, rgba(255,255,255,.18) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 30%, rgba(255,255,255,.12) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .hero-deco i {
      position: absolute; color: rgba(255,255,255,.3);
      animation: floatStar 6s ease-in-out infinite;
      font-style: normal;
    }
    .hero-deco i:nth-child(1) { top:12%; left:7%;  font-size:1.6rem; animation-delay:0s; }
    .hero-deco i:nth-child(2) { top:65%; left:4%;  font-size:1.1rem; animation-delay:1.2s; }
    .hero-deco i:nth-child(3) { top:20%; right:8%; font-size:1.9rem; animation-delay:2.1s; }
    .hero-deco i:nth-child(4) { top:72%; right:5%; font-size:1.2rem; animation-delay:.6s; }
    .hero-deco i:nth-child(5) { top:42%; left:48%; font-size:1rem;   animation-delay:1.8s; }
    @keyframes floatStar {
      0%,100% { transform: translateY(0) scale(1); opacity:.3; }
      50%      { transform: translateY(-12px) scale(1.25); opacity:.65; }
    }
    .hero h1 {
      font-family: 'Kaisei Decol', serif;
      font-size: clamp(1.8rem,6vw,3rem); color: #fff;
      text-shadow: 0 3px 18px rgba(0,0,0,.2);
      position: relative; z-index: 1; letter-spacing: .06em;
    }
    .hero p { color: rgba(255,255,255,.87); font-size:.88rem; margin-top:7px; position:relative;z-index:1; }
    .hero-count {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.22); border: 1.5px solid rgba(255,255,255,.4);
      border-radius: 999px; padding: 5px 16px; margin-top: 14px;
      font-size: .82rem; font-weight: 700; color: #fff;
      position: relative; z-index: 1;
    }

    /* ─── LAYOUT ─── */
    .page-body {
      max-width: 1100px; margin: 0 auto;
      padding: 24px 16px calc(40px + var(--safe-bot));
      display: grid; grid-template-columns: 272px 1fr; gap: 22px; align-items: start;
    }
    @media (max-width: 768px) { .page-body { grid-template-columns: 1fr; gap: 14px; } }

    /* ─── SIDEBAR ─── */
    .sidebar {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 24px; overflow: hidden;
      box-shadow: var(--shadow-sm); position: sticky; top: 74px;
    }
    .sidebar-head {
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
      padding: 13px 18px; display: flex; align-items: center; gap: 8px;
    }
    .sidebar-head h2 { font-family:'Kaisei Decol',serif; color:#fff; font-size:.98rem; letter-spacing:.04em; }
    .sidebar-body { padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 16px; }

    .sf-group { display: flex; flex-direction: column; gap: 7px; }
    .sf-label {
      font-size: .73rem; font-weight: 700; color: var(--text-sub);
      letter-spacing: .05em; display: flex; align-items: center; gap: 5px;
    }
    .sf-label::before { content:''; display:block; width:3px; height:11px; background:var(--pink); border-radius:2px; }

    .sf-pills { display: flex; gap: 5px; flex-wrap: wrap; }
    .sf-pill {
      padding: 5px 13px; border-radius: 999px;
      border: 2px solid var(--border); background: #fff;
      color: var(--text-sub); font-family: inherit;
      font-size: .76rem; font-weight: 700; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: all .15s; min-height: 34px;
    }
    .sf-pill:hover { border-color: var(--pink); color: var(--pink); }
    .sf-pill.on           { background: var(--pink);   border-color: var(--pink);   color: #fff; }
    .sf-pill.on.purple    { background: var(--purple); border-color: var(--purple); }
    .sf-pill.on.mint      { background: var(--mint);   border-color: var(--mint); }

    .sf-checks { display: flex; flex-wrap: wrap; gap: 5px; }
    .sf-check-label {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 11px; border-radius: 999px;
      border: 2px solid var(--border); background: #fff;
      font-size: .74rem; font-weight: 700; color: var(--text-sub);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: all .15s; user-select: none; min-height: 32px;
    }
    .sf-check-label input { display: none; }
    .sf-check-label:hover { border-color: var(--pink); color: var(--pink-dk); }
    .sf-check-label:has(input:checked) { background: var(--pink-lt); border-color: var(--pink); color: var(--pink-dk); }
    .sf-dot { width:7px; height:7px; border-radius:50%; background:var(--border); transition:background .15s; flex-shrink:0; }
    .sf-check-label:has(input:checked) .sf-dot { background: var(--pink); }

    .sf-reset {
      width: 100%; padding: 9px; border-radius: 12px;
      border: 2px solid var(--border); background: var(--pink-pale);
      color: var(--text-sub); font-family: inherit;
      font-size: .82rem; font-weight: 700; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: all .15s; min-height: 40px;
    }
    .sf-reset:hover { border-color: var(--pink); color: var(--pink-dk); }

    /* mobile toggle */
    .mobile-filter-btn {
      display: none; width: 100%; padding: 11px 18px;
      background: var(--card); border: 2px solid var(--border);
      border-radius: 20px; box-shadow: var(--shadow-sm);
      font-family: inherit; font-size: .86rem; font-weight: 700;
      color: var(--pink-dk); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      align-items: center; justify-content: space-between; gap: 8px;
      transition: all .15s;
    }
    .mobile-filter-btn:hover { border-color: var(--pink); }
    .mobile-filter-btn .arrow { transition: transform .22s; }
    .mobile-filter-btn.open .arrow { transform: rotate(180deg); }
    @media (max-width: 768px) {
      .mobile-filter-btn { display: flex; }
      .sidebar { position: static; display: none; }
      .sidebar.open { display: block; }
    }

    /* ─── MAIN ─── */
    .main-area { display: flex; flex-direction: column; gap: 14px; }
    .result-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .result-count { font-size: .84rem; font-weight: 700; color: var(--text-sub); }
    .result-count strong { color: var(--pink); font-size: 1.1em; }
    .active-badges { display: flex; flex-wrap: wrap; gap: 5px; }
    .a-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--pink-lt); color: var(--pink-dk);
      border-radius: 999px; font-size: .72rem; font-weight: 700;
      padding: 3px 8px 3px 10px;
    }
    .a-badge button { background: none; border: none; cursor: pointer; color: var(--pink-dk); font-size: .88rem; line-height: 1; -webkit-tap-highlight-color: transparent; padding: 0 0 0 2px; }

    /* ─── GRID ─── */
    .chara-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
      gap: 12px;
    }
    @media (max-width: 480px) { .chara-grid { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 9px; } }

    .chara-card {
      background: var(--card); border: 2px solid var(--border);
      border-radius: 18px; overflow: hidden; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      animation: cardIn .3s ease both;
    }
    .chara-card:hover { transform: translateY(-5px) scale(1.03); box-shadow: var(--shadow-md); border-color: var(--pink); }
    @keyframes cardIn { from { opacity:0; transform: scale(.9) translateY(10px); } to { opacity:1; transform: scale(1) translateY(0); } }

    .chara-img-wrap {
      aspect-ratio: 1;
      background: linear-gradient(135deg, var(--pink-lt) 0%, var(--purple-lt) 100%);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .chara-img-wrap img { width:100%; height:100%; object-fit:contain; }
    .chara-placeholder { font-size: 3rem; }
    .chara-gender {
      position: absolute; top: 6px; right: 6px;
      width: 21px; height: 21px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .62rem; font-weight: 700;
      box-shadow: 0 1px 5px rgba(0,0,0,.18);
    }
    .chara-gender.f { background: #ff80b5; color: #fff; }
    .chara-gender.m { background: #74b3ff; color: #fff; }
    .chara-minibadges {
      position: absolute; bottom: 5px; left: 5px;
      display: flex; gap: 3px;
    }
    .mb {
      font-size: .53rem; font-weight: 700; padding: 2px 5px;
      border-radius: 999px; line-height: 1.4;
    }
    .mb.g { background: rgba(45,212,160,.85); color: #fff; }
    .mb.p { background: rgba(185,110,247,.85); color: #fff; }

    .chara-info { padding: 7px 9px 9px; border-top: 1px solid var(--border); }
    .chara-name { font-family:'Kaisei Decol',serif; font-size:.9rem; font-weight:700; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chara-sub { font-size:.67rem; color:var(--text-sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .empty-state { text-align:center; padding:60px 20px; color:var(--text-sub); grid-column:1/-1; }
    .empty-state .icon { font-size:4rem; margin-bottom:14px; }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(42,20,40,.55); backdrop-filter: blur(5px);
      z-index: 500; display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--card); border-radius: 26px;
      max-width: 510px; width: 100%; max-height: 90vh;
      overflow-y: auto; box-shadow: var(--shadow-lg);
      transform: scale(.9) translateY(24px);
      transition: transform .28s cubic-bezier(.34,1.56,.64,1);
      scrollbar-width: thin; scrollbar-color: var(--pink-lt) transparent;
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }

    .modal-header {
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
      padding: 20px 18px 18px;
      display: flex; gap: 14px; align-items: flex-start; position: relative;
    }
    .modal-close {
      position: absolute; top: 12px; right: 13px;
      width: 30px; height: 30px; border-radius: 50%;
      border: none; background: rgba(255,255,255,.28);
      color: #fff; font-size: .95rem; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .modal-close:hover { background: rgba(255,255,255,.48); }
    .modal-img-wrap {
      width: 86px; height: 86px; flex-shrink: 0;
      border-radius: 16px; background: rgba(255,255,255,.24);
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .modal-img-wrap img { width:100%; height:100%; object-fit:contain; }
    .modal-placeholder { font-size: 2.8rem; }
    .modal-title-area { flex: 1; min-width: 0; padding-top: 2px; }
    .modal-name { font-family:'Kaisei Decol',serif; font-size:1.55rem; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.15); line-height:1.2; }
    .modal-en { font-size:.78rem; color:rgba(255,255,255,.72); margin-top:3px; }
    .modal-badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
    .m-badge {
      display: inline-flex; align-items: center;
      border-radius: 999px; font-size: .73rem; font-weight: 700; padding: 3px 10px;
    }
    .m-badge.w  { background: rgba(255,255,255,.28); color: #fff; }
    .m-badge.g  { background: rgba(45,212,160,.3);  color: #e0fff6; }
    .m-badge.p  { background: rgba(255,255,255,.2);  color: rgba(255,255,255,.88); }
    .m-badge.y  { background: rgba(255,210,63,.28);  color: #fff; }

    .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

    /* spell */
    .spell-block {
      background: linear-gradient(135deg, var(--yellow-lt), var(--pink-lt));
      border: 2px dashed var(--yellow); border-radius: 18px;
      padding: 13px 15px; text-align: center;
    }
    .spell-label {
      font-size: .7rem; font-weight: 700; color: var(--text-sub);
      letter-spacing: .06em; margin-bottom: 6px;
    }
    .spell-text { font-family:'Kaisei Decol',serif; font-size:.98rem; color:var(--pink-dk); line-height:1.6; font-weight:700; }

    /* honmyo */
    .honmyo-block {
      background: var(--purple-lt); border: 2px solid #e0c8ff;
      border-radius: 16px; padding: 11px 14px;
    }
    .honmyo-label { font-size:.7rem; font-weight:700; color:#7c3aed; letter-spacing:.05em; margin-bottom:4px; }
    .honmyo-text { font-size:.86rem; color:#5b21b6; line-height:1.5; }

    /* detail table */
    .detail-table { display:grid; grid-template-columns:auto 1fr; gap:1px; background:var(--border); border-radius:14px; overflow:hidden; border:1.5px solid var(--border); }
    .dt-k { background:var(--pink-pale); padding:8px 12px; font-size:.8rem; font-weight:700; color:#8a3a6a; white-space:nowrap; }
    .dt-v { background:#fff; padding:8px 12px; font-size:.84rem; word-break:break-all; }

    @media (max-width: 480px) { .modal-name { font-size:1.25rem; } }
    @media (pointer: coarse) { .sf-pill { min-height:40px; } .sf-check-label { min-height:38px; } }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="site-logo">🥚ここたま検索</div>
    <div class="header-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search" type="search"
        placeholder="名前・ひらがな・ローマ字で検索"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="search"/>
      <button class="header-clear" id="clearBtn" aria-label="クリア">✕</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-deco"><i>✦</i><i>★</i><i>✦</i><i>★</i><i>✦</i></div>
  <h1>🥚 ここたま検索 🥚</h1>
  <p>名前を入れてここたまを探そう！</p>
  <div class="hero-count" id="heroCount">読み込み中…</div>
</section>

<div class="page-body">

  <!-- mobile filter button -->
  <button class="mobile-filter-btn" id="mobileFilterBtn" aria-expanded="false">
    <span>🔍 詳細検索・絞り込み</span>
    <span class="arrow">▼</span>
  </button>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head"><span>🔍</span><h2>詳細検索</h2></div>
    <div class="sidebar-body">

      <div class="sf-group">
        <div class="sf-label">検索モード</div>
        <div class="sf-pills">
          <button class="sf-pill on" data-mode="prefix">前方一致</button>
          <button class="sf-pill"    data-mode="partial">部分一致</button>
          <button class="sf-pill"    data-mode="fuzzy">あいまい</button>
        </div>
      </div>

      <div class="sf-group">
        <div class="sf-label">性別</div>
        <div class="sf-pills">
          <button class="sf-pill" data-filter="性別" data-val="1">♀ 女の子</button>
          <button class="sf-pill" data-filter="性別" data-val="0">♂ 男の子</button>
        </div>
      </div>

      <div class="sf-group">
        <div class="sf-label">一人前</div>
        <div class="sf-pills">
          <button class="sf-pill mint" data-filter="一人前" data-val="1">〇 一人前</button>
          <button class="sf-pill mint" data-filter="一人前" data-val="0">× まだ</button>
        </div>
      </div>

      <div class="sf-group">
        <div class="sf-label">公募</div>
        <div class="sf-pills">
          <button class="sf-pill purple" data-filter="公募" data-val="1" data-match="1,2">〇 あり</button>
          <button class="sf-pill purple" data-filter="公募" data-val="2">〇 スタッフ枠</button>
          <button class="sf-pill purple" data-filter="公募" data-val="0">× なし</button>
        </div>
      </div>

      <div class="sf-group">
        <div class="sf-label">何から生まれたか</div>
        <div class="sf-checks" id="birthChecks"></div>
      </div>

      <button class="sf-reset" id="resetBtn">🔄 フィルターをリセット</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-area">
    <div class="result-bar">
      <div class="result-count" id="resultCount">読み込み中…</div>
      <div class="active-badges" id="activeBadges"></div>
    </div>
    <div class="chara-grid" id="charaGrid"></div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>

<script>
let allData   = [];
let matchMode = 'prefix';
let filters   = {};
let query     = '';

const searchEl        = document.getElementById('search');
const clearBtn        = document.getElementById('clearBtn');
const charaGrid       = document.getElementById('charaGrid');
const resultCount     = document.getElementById('resultCount');
const heroCount       = document.getElementById('heroCount');
const activeBadges    = document.getElementById('activeBadges');
const modalOverlay    = document.getElementById('modalOverlay');
const modal           = document.getElementById('modal');
const birthChecks     = document.getElementById('birthChecks');
const mobileFilterBtn = document.getElementById('mobileFilterBtn');
const sidebar         = document.getElementById('sidebar');

/* converters */
function toHiragana(str) {
  return str.replace(/[\u30A1-\u30F6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
}
function toRomaji(str) {
  const map={あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',ん:'n',が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',だ:'da',ぢ:'di',づ:'du',で:'de',ど:'do',ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po',っ:'tt',ー:'-'};
  return str.split('').map(c=>map[c]||c).join('');
}
function convertValue(key, value) {
  if (key==='性別')    { if(value==='1')return'♀ 女の子'; if(value==='0')return'♂ 男の子'; return'不明'; }
  if (key==='一人前')  { if(value==='1')return'〇'; if(value==='0')return'×'; return'不明'; }
  if (key==='公募')    { if(value==='1')return'〇'; if(value==='2')return'〇（スタッフ）'; if(value==='0')return'×'; return'不明'; }
  if (key==='魔法の呪文') { if(value==='1')return'ここんぽいぽいここったま！'; if(!value||value==='0')return'不明'; return value; }
  return value && value.trim()!=='' ? value : '不明';
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* CSV load */
fetch('cocotama.csv')
  .then(r=>r.text())
  .then(text=>{
    const lines=text.trim().split('\n');
    const headers=lines[0].split(',');
    allData=lines.slice(1).map(line=>{
      const values=line.split(',');
      const obj={};
      headers.forEach((h,i)=>obj[h]=(values[i]||'').trim());
      obj._hira=toHiragana(obj['名前']||'');
      obj._roma=toRomaji(obj._hira);
      return obj;
    });
    allData.sort((a,b)=>a._hira.localeCompare(b._hira,'ja'));
    heroCount.textContent=`全 ${allData.length} キャラクター`;
    buildBirthChecks();
    render();
  })
  .catch(()=>{
    heroCount.textContent='データ読み込みエラー';
    charaGrid.innerHTML='<div class="empty-state"><div class="icon">⚠️</div><p>cocotama.csv が見つかりません</p></div>';
  });

/* birth checkboxes */
function buildBirthChecks() {
  const births=[...new Set(allData.map(d=>d['何から生まれたか']).filter(v=>v&&v!=='0'))].sort();
  births.forEach(b=>{
    const lbl=document.createElement('label');
    lbl.className='sf-check-label';
    lbl.innerHTML=`<input type="checkbox" data-filter="何から生まれたか" data-val="${esc(b)}"><span class="sf-dot"></span>${esc(b)}`;
    lbl.querySelector('input').addEventListener('change',onCheckChange);
    birthChecks.appendChild(lbl);
  });
}
function onCheckChange(e){
  const {filter,val}=e.target.dataset;
  if(!filters[filter])filters[filter]=new Set();
  if(e.target.checked)filters[filter].add(val);
  else filters[filter].delete(val);
  renderBadges(); render();
}

/* filter match */
function matchFilter(d){
  for(const [key,vals] of Object.entries(filters)){
    if(!vals||vals.size===0)continue;
    let ok=false;
    for(const raw of vals){
      const btn=document.querySelector(`.sf-pill[data-filter="${key}"][data-val="${raw}"]`);
      const matchVals=btn?.dataset.match?btn.dataset.match.split(','):[raw];
      if(matchVals.includes(d[key])){ ok=true; break; }
    }
    if(!ok)return false;
  }
  return true;
}

/* search */
function fuzzyScore(target,q){
  let ti=0,qi=0,score=0;
  while(ti<target.length&&qi<q.length){ if(target[ti]===q[qi]){score++;qi++;} ti++; }
  return qi===q.length?score/target.length:-1;
}
function getResults(){
  let pool=allData.filter(matchFilter);
  if(!query)return pool;
  const ql=query.toLowerCase(),qh=toHiragana(ql),qr=toRomaji(qh);
  if(matchMode==='prefix') return pool.filter(d=>d['名前'].startsWith(query)||d._hira.startsWith(qh)||d._roma.startsWith(qr));
  if(matchMode==='partial') return pool.filter(d=>d['名前'].includes(query)||d._hira.includes(qh)||d._roma.includes(qr));
  const scored=pool.map(d=>({d,s:Math.max(fuzzyScore(d['名前'],query),fuzzyScore(d._hira,qh),fuzzyScore(d._roma,qr))})).filter(x=>x.s>=0);
  scored.sort((a,b)=>b.s-a.s);
  return scored.map(x=>x.d);
}

/* render grid */
function render(){
  const results=getResults();
  resultCount.innerHTML=`<strong>${results.length}</strong> 件見つかりました`;
  if(!results.length){
    charaGrid.innerHTML='<div class="empty-state"><div class="icon">😢</div><p>条件に一致するここたまがいません<br>検索条件を変えてみてね！</p></div>';
    return;
  }
  charaGrid.innerHTML='';
  results.forEach((d,i)=>{
    const card=document.createElement('div');
    card.className='chara-card';
    card.style.animationDelay=`${Math.min(i*18,280)}ms`;
    const isF=d['性別']==='1', isM=d['性別']==='0';
    const isFull=d['一人前']==='1';
    const hasKoubo=d['公募']==='1'||d['公募']==='2';
    const birth=d['何から生まれたか']&&d['何から生まれたか']!=='0';
    const enName=d['EN-Name']&&d['EN-Name']!=='0'?d['EN-Name']:'';
    card.innerHTML=`
      <div class="chara-img-wrap">
        ${enName
          ?`<img src="images/${esc(enName)}.webp"
              onerror="this.src='images/${esc(enName)}.png';this.onerror=function(){this.src='images/${esc(enName)}.jpg';this.onerror=function(){this.style.display='none';this.parentElement.querySelector('.chara-placeholder').style.display='flex';}}"
              alt="${esc(d['名前'])}"><span class="chara-placeholder" style="display:none">🌟</span>`
          :`<span class="chara-placeholder">⭐️</span>`}
        <span class="chara-gender ${isF?'f':isM?'m':''}">${isF?'♀':isM?'♂':'？'}</span>
        <div class="chara-minibadges">
          ${isFull?'<span class="mb g">一人前</span>':''}
          ${hasKoubo?'<span class="mb p">公募</span>':''}
        </div>
      </div>
      <div class="chara-info">
        <div class="chara-name">${esc(d['名前'])}</div>
        ${birth?`<div class="chara-sub">🥚 ${esc(d['何から生まれたか'])}</div>`:''}
      </div>`;
    card.addEventListener('click',()=>openModal(d));
    charaGrid.appendChild(card);
  });
}

/* badges */
const BADGE_LABELS={'性別':{'1':'♀ 女の子','0':'♂ 男の子'},'一人前':{'1':'〇 一人前','0':'× まだ'},'公募':{'1':'〇 あり','2':'〇 スタッフ枠','0':'× なし'}};
function renderBadges(){
  activeBadges.innerHTML='';
  for(const [key,vals] of Object.entries(filters)){
    if(!vals||vals.size===0)continue;
    vals.forEach(raw=>{
      const map=BADGE_LABELS[key];
      const text=map?map[raw]||raw:raw;
      const badge=document.createElement('span');
      badge.className='a-badge';
      badge.innerHTML=`${esc(key)}：${esc(text)}<button aria-label="削除">✕</button>`;
      badge.querySelector('button').addEventListener('click',()=>removeBadge(key,raw));
      activeBadges.appendChild(badge);
    });
  }
}
function removeBadge(key,raw){
  filters[key]?.delete(raw);
  document.querySelectorAll(`.sf-pill[data-filter="${key}"][data-val="${raw}"]`).forEach(p=>p.classList.remove('on'));
  const cb=document.querySelector(`input[data-filter="${key}"][data-val="${raw}"]`);
  if(cb)cb.checked=false;
  renderBadges(); render();
}

/* modal */
const MODAL_SKIP=new Set(['名前','EN-Name','_hira','_roma','性別','一人前','公募','魔法の呪文','本名']);
function openModal(d){
  const isF=d['性別']==='1',isM=d['性別']==='0';
  const isFull=d['一人前']==='1';
  const koubo=convertValue('公募',d['公募']);
  const spell=convertValue('魔法の呪文',d['魔法の呪文']);
  const hasSpell=d['魔法の呪文']&&d['魔法の呪文']!=='0'&&d['魔法の呪文']!=='';
  const hasHonmyo=d['本名']&&d['本名']!=='0'&&d['本名']!=='';
  const enName=d['EN-Name']&&d['EN-Name']!=='0'?d['EN-Name']:'';
  const rows=Object.keys(d).filter(k=>!MODAL_SKIP.has(k)&&!k.startsWith('_'));

  modal.innerHTML=`
    <div class="modal-header">
      <button class="modal-close" id="modalClose" aria-label="閉じる">✕</button>
      <div class="modal-img-wrap">
        ${enName
          ?`<img src="images/${esc(enName)}.webp"
              onerror="this.src='images/${esc(enName)}.png';this.onerror=function(){this.src='images/${esc(enName)}.jpg';this.onerror=function(){this.style.display='none';this.parentElement.querySelector('.modal-placeholder').style.display='flex';}}"
              alt="${esc(d['名前'])}"><span class="modal-placeholder" style="display:none">🌟</span>`
          :`<span class="modal-placeholder">🌟</span>`}
      </div>
      <div class="modal-title-area">
        <div class="modal-name">${esc(d['名前'])}</div>
        ${enName?`<div class="modal-en">${esc(enName)}</div>`:''}
        <div class="modal-badges">
          <span class="m-badge w">${isF?'♀ 女の子':isM?'♂ 男の子':'性別不明'}</span>
          ${isFull?'<span class="m-badge g">✓ 一人前</span>':'<span class="m-badge y">△ 見習い中</span>'}
          <span class="m-badge p">公募：${esc(koubo)}</span>
        </div>
      </div>
    </div>
    <div class="modal-body">
      ${hasSpell?`<div class="spell-block"><div class="spell-label">✨ 魔法の呪文 ✨</div><div class="spell-text">${esc(spell)}</div></div>`:''}
      ${hasHonmyo?`<div class="honmyo-block"><div class="honmyo-label">👑 本名</div><div class="honmyo-text">${esc(d['本名'])}</div></div>`:''}
      ${rows.length?`<div class="detail-table">${rows.map(k=>`<div class="dt-k">${esc(k)}</div><div class="dt-v">${esc(convertValue(k,d[k]))}</div>`).join('')}</div>`:''}
    </div>`;

  document.getElementById('modalClose').addEventListener('click',closeModal);
  modalOverlay.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  modalOverlay.classList.remove('open');
  document.body.style.overflow='';
}
modalOverlay.addEventListener('click',e=>{ if(e.target===modalOverlay)closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });

/* search events */
searchEl.addEventListener('input',()=>{
  query=searchEl.value;
  clearBtn.classList.toggle('show',query.length>0);
  render();
});
clearBtn.addEventListener('click',()=>{
  searchEl.value=query='';
  clearBtn.classList.remove('show');
  render(); searchEl.focus();
});

/* mode pills */
document.querySelectorAll('.sf-pill[data-mode]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    matchMode=btn.dataset.mode;
    document.querySelectorAll('.sf-pill[data-mode]').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); render();
  });
});

/* filter pills */
const SINGLE_KEYS=new Set(['性別','一人前','公募']);
document.querySelectorAll('.sf-pill[data-filter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const {filter,val}=btn.dataset;
    if(!filters[filter])filters[filter]=new Set();
    const s=filters[filter];
    if(SINGLE_KEYS.has(filter)){
      if(s.has(val)){ s.delete(val); btn.classList.remove('on'); }
      else {
        document.querySelectorAll(`.sf-pill[data-filter="${filter}"]`).forEach(p=>p.classList.remove('on'));
        s.clear(); s.add(val); btn.classList.add('on');
      }
    } else {
      if(s.has(val)){ s.delete(val); btn.classList.remove('on'); }
      else { s.add(val); btn.classList.add('on'); }
    }
    renderBadges(); render();
  });
});

/* reset */
document.getElementById('resetBtn').addEventListener('click',()=>{
  filters={};
  document.querySelectorAll('.sf-pill[data-filter]').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('input[data-filter]').forEach(cb=>cb.checked=false);
  renderBadges(); render();
});

/* mobile filter */
mobileFilterBtn.addEventListener('click',()=>{
  const open=sidebar.classList.toggle('open');
  mobileFilterBtn.classList.toggle('open',open);
  mobileFilterBtn.setAttribute('aria-expanded',String(open));
});
</script>
